name: Publish Evolution Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect image entrypoint and cmd
        run: |
          docker pull atendai/evolution-api:v2.2.2
          echo '=== ENTRYPOINT & CMD ==='
          docker inspect atendai/evolution-api:v2.2.2 --format 'Entrypoint: {{json .Config.Entrypoint}} | Cmd: {{json .Config.Cmd}} | WorkDir: {{json .Config.WorkingDir}}'

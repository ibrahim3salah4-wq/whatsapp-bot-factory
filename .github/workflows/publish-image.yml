name: Publish Evolution Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image
        run: |
          docker pull atendai/evolution-api:latest || docker pull atendai/evolution-api:v2.2.2 || true

      - name: Tag and Push
        run: |
          IMAGE_NAME=$(docker images --format '{{.Repository}}:{{.Tag}}' | head -n 1)
          echo 'Found image:' $IMAGE_NAME
          docker tag $IMAGE_NAME ghcr.io/${{ github.repository_owner }}/evolution-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/evolution-api:latest

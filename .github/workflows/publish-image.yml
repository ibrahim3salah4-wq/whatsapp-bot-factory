name: Mirror Evolution API Image to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Retag Evolution API Image
        run: |
          docker pull evoapicloud/evolution-api:latest || docker pull evolutionapi/evolution-api:latest
          docker tag evolutionapi/evolution-api:latest ghcr.io/${{ github.repository_owner }}/evolution-api:latest || true
          docker push ghcr.io/${{ github.repository_owner }}/evolution-api:latest || true

name: Publish Evolution Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Push to GHCR
        run: |
          docker pull evolutionapi/evolution-api:latest
          docker tag evolutionapi/evolution-api:latest ghcr.io/ibrahim3salah4-wq/evolution-api:latest
          docker push ghcr.io/ibrahim3salah4-wq/evolution-api:latest
